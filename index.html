<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101016" />
    <meta name="description" content="Crie aulas e slides interativos, convide alunos pelo celular e ensine com imagens, modelos 3D e quizzes ao vivo." />
    <title>Storage Lab — Aulas interativas</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/brand.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"><p style="padding:3rem;font:18px system-ui;color:#d6c4ed">Preparando seu espaço de ensino…</p></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (document.documentElement.dataset.appReady === 'true') return;
          var app = document.getElementById('app');
          app.textContent = '';
          var box = document.createElement('div'); box.style.cssText = 'padding:3rem;font:18px system-ui;color:#d6c4ed';
          var text = document.createElement('p'); text.textContent = 'O site não terminou de carregar. Tente recarregar para buscar a versão atual.';
          var button = document.createElement('button'); button.textContent = 'Recarregar site'; button.style.cssText = 'padding:12px 20px;cursor:pointer'; button.onclick = function () { var url = new URL(location.href); url.searchParams.set('reload', Date.now()); location.replace(url.href); };
          box.append(text, button); app.append(box);
        }, 12000);
      });
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
