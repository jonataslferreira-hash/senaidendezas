# Lets Cloudflare Builds find the file API instead of auto-detecting vite.config.js.
name = "storage-lab-files"
account_id = "4cdb64404c75086e5ac536d88abd30e6"
main = "cloudflare/r2-worker.js"
compatibility_date = "2026-11-01"

[[r2_buckets]]
binding = "FILES"
bucket_name = "storagelab"

[[previews.r2_buckets]]
binding = "FILES"
bucket_name = "storagelab"
