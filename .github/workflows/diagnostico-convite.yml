name: Diagnóstico temporário de convite
on:
  push:
    branches: [arena/c09be721-senaidendezas]
    paths: [.github/workflows/diagnostico-convite.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testar serviço e navegador reais
        run: |
          npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          try {
            await page.addInitScript(() => { if (location.hostname === 'jonataslferreira-hash.github.io') sessionStorage.setItem('test-arrival',location.href); });
            await page.goto('https://is.gd/h4bAV2#s=123456', {waitUntil:'domcontentloaded',timeout:30000});
            const arrival = await page.evaluate(() => sessionStorage.getItem('test-arrival'));
            if (arrival !== 'https://jonataslferreira-hash.github.io/senaidendezas/#s=123456') throw Error('Redirecionamento inesperado: '+arrival);
            const local = await browser.newPage();
            await local.addInitScript(() => localStorage.setItem('sl-tour','done'));
            await local.goto('http://127.0.0.1:5173/'+new URL(arrival).hash,{waitUntil:'domcontentloaded'});
            await local.locator('#room-code').waitFor({timeout:30000});
            const code=await local.locator('#room-code').inputValue();
            if(code!=='123456'||new URL(local.url()).searchParams.get('s')!=='123456')throw Error('Código incorreto: '+code+' '+local.url());
          } catch(error) {
            const summary=String(error).replace(/\s+/g,' ').slice(0,600);
            console.log('::error::'+summary+' URL '+page.url());
            process.exitCode=1;
          }
          await browser.close();
          JS
