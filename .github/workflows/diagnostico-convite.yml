name: Confirmar convite publicado
on:
  push:
    branches: [arena/c09be721-senaidendezas]
    paths: [.github/workflows/diagnostico-convite.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Abrir link curto publicado no navegador
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true}),page=await browser.newPage();
          try{
            await page.addInitScript(()=>localStorage.setItem('sl-tour','done'));
            await page.goto('https://is.gd/h4bAV2#s=123456',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#room-code').waitFor({timeout:30000});
            const code=await page.locator('#room-code').inputValue();
            if(code!=='123456'||new URL(page.url()).searchParams.get('s')!=='123456')throw Error('Destino ou código incorreto: '+page.url()+' '+code);
          }catch(e){console.log('::error::'+String(e).replace(/\s+/g,' ').slice(0,600)+' URL '+page.url());process.exitCode=1;}
          await browser.close();
          JS
